<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Stoper — Lab 3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        font-family: system-ui, Arial, sans-serif;
      }
      body {
        display: grid;
        place-content: center;
        min-height: 100dvh;
        margin: 0;
        background: #fafafa;
      }
      .card {
        background: #fff;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        width: min(420px, 92vw);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      .time {
        font-variant-numeric: tabular-nums;
        font-size: 40px;
        margin: 8px 0 20px;
        letter-spacing: 0.5px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        background: #f3f4f6;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.02s ease, background 0.15s ease;
      }
      button:active {
        transform: translateY(1px);
      }
      button.primary {
        background: #111827;
        color: #fff;
        border-color: #111827;
      }
      button.danger {
        background: #fee2e2;
        border-color: #fecaca;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .hint {
        color: #6b7280;
        font-size: 12px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <main class="card" role="application" aria-label="Stoper">
      <h1>Stoper</h1>
      <div id="display" class="time" aria-live="polite">0s</div>
      <div class="row">
        <button id="startBtn" class="primary">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="resetBtn" class="danger">Reset</button>
      </div>
      <div class="hint">Spacja — start/stop, R — reset</div>
    </main>

    <script>
      let startTimestamp = null;
      let elapsedMs = 0;
      let timerId = null;

      const display = document.getElementById("display");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const resetBtn = document.getElementById("resetBtn");

      function formatTime(ms) {
        const totalSec = Math.floor(ms / 1000);
        if (totalSec < 60) return `${totalSec}s`;
        const min = Math.floor(totalSec / 60);
        const sec = totalSec % 60;
        return `${min}min ${sec}s`;
      }

      function render() {
        const now = Date.now();
        const runningMs = startTimestamp ? now - startTimestamp : 0;
        display.textContent = formatTime(elapsedMs + runningMs);
      }

      function setRunningUI(isRunning) {
        startBtn.disabled = isRunning;
        stopBtn.disabled = !isRunning;
      }

      function start() {
        if (timerId) return;
        startTimestamp = Date.now();
        timerId = setInterval(render, 100);
        setRunningUI(true);
        render();
      }

      function stop() {
        if (!timerId) return;
        clearInterval(timerId);
        timerId = null;
        elapsedMs += Date.now() - startTimestamp;
        startTimestamp = null;
        setRunningUI(false);
        render();
      }

      function reset() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        startTimestamp = null;
        elapsedMs = 0;
        setRunningUI(false);
        render();
      }

      startBtn.addEventListener("click", start);
      stopBtn.addEventListener("click", stop);
      resetBtn.addEventListener("click", reset);

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          timerId ? stop() : start();
        } else if (e.key.toLowerCase() === "r") {
          reset();
        }
      });

      setRunningUI(false);
      render();
    </script>
  </body>
</html>
