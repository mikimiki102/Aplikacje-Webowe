<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restauracja — Kontakt</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="layout">
    <header><h1>Restauracja</h1></header>

    <nav aria-label="Główna nawigacja">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="galeria.html">Galeria</a></li>
        <li><a class="active" href="kontakt.html">Kontakt</a></li>
        <li><a href="main_page.html">Main Page</a></li>
      </ul>
    </nav>

    <main>
      <h2>Kontakt</h2>

      <form class="contact-form" action="#" method="post">
        <!-- E-Mail (input type="text" z placeholderem) -->
        <div class="field">
          <label for="email">E-mail</label>
          <input
            type="text"
            id="email"
            name="email"
            placeholder="np. jan.kowalski@example.com"
          />
        </div>

        <!-- Temat (select z ≥3 opcjami) -->
        <div class="field">
          <label for="topic">Temat wiadomości</label>
          <select id="topic" name="topic">
            <option value="rezerwacja">Rezerwacja</option>
            <option value="menu">Pytanie o menu</option>
            <option value="praca">Współpraca / praca</option>
          </select>
        </div>

        <!-- Wiadomość (textarea z placeholderem) -->
        <div class="field">
          <label for="message">Wiadomość</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Napisz nam, w czym możemy pomóc…"
          ></textarea>
        </div>

        <!-- Wyślij (input type="submit") -->
        <div class="actions">
          <input type="submit" value="Wyślij" />
        </div>
      </form>
    </main>

    <footer>© 2025 Mikołaj Wałek</footer>
  </body>
</html>
